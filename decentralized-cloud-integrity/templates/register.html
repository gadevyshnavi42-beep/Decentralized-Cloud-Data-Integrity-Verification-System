{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap"><div class="card auth-card p-4">
  <h3 class="text-center mb-3"><i class="bi bi-person-plus text-primary"></i> Create Account</h3>
  <form id="registerForm">
    <div class="mb-3"><label class="form-label">Username</label><input id="username" class="form-control" minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required></div>
    <div class="mb-3"><label class="form-label">Email address</label><input type="email" id="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Password (min 8 characters)</label><input type="password" id="password" class="form-control" minlength="8" required></div>
    <div class="mb-3"><label class="form-label">Confirm password</label><input type="password" id="confirm" class="form-control" required></div>
    <button class="btn btn-primary w-100 rounded-pill" type="submit">Register</button>
  </form>
  <p class="text-center mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div></div>
{% endblock %}
