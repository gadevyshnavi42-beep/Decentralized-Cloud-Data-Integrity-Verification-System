{% extends "base.html" %}
{% block title %}Upload{% endblock %}
{% block content %}
<h3 class="mb-4">Upload File</h3>
<div class="card p-4">
  <div id="dropzone" class="dropzone text-center">
    <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
    <p class="mb-2">Drag &amp; drop a file here, or</p>
    <input type="file" id="fileInput" class="d-none">
    <button type="button" id="chooseBtn" class="btn btn-outline-primary rounded-pill">Choose File</button>
    <p class="small text-muted mt-3 mb-0">Max 16 MB · txt, pdf, images, office files, csv, zip, json, md</p>
  </div>
  <div id="fileInfo" class="mt-3 d-none"><i class="bi bi-file-earmark"></i> <b id="fName"></b> <span class="text-muted" id="fSize"></span></div>
  <div class="progress mt-3 d-none" id="progWrap" style="height:20px"><div id="progBar" class="progress-bar progress-bar-striped progress-bar-animated" style="width:0"></div></div>
  <button id="uploadBtn" class="btn btn-primary rounded-pill mt-3 align-self-start" disabled>Upload</button>
  <div id="uploadStatus" class="mt-3"></div>
</div>
{% endblock %}
